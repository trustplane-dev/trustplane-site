<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#0d1b2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6EE7FF"/>
      <stop offset="100%" stop-color="#8B9CFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- grid lines -->
  <g stroke="#2B3854" stroke-width="1" opacity="0.25">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- logo mark -->
  <g transform="translate(80,80)">
    <path d="M28 8 L48 18 V38 L28 48 L8 38 V18 L28 8 Z" fill="none" stroke="#6EE7FF" stroke-width="2"/>
    <path d="M28 18 L38 23 V33 L28 38 L18 33 V23 L28 18 Z" fill="#6EE7FF" fill-opacity="0.2" stroke="#6EE7FF" stroke-width="1.5"/>
  </g>
  <text x="140" y="115" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#F4F7FB">TrustPlane</text>
  <!-- eyebrow -->
  <text x="80" y="230" font-family="IBM Plex Mono, monospace" font-size="22" fill="#6EE7FF" letter-spacing="2">OPEN-SOURCE MACHINE AUTHORIZATION</text>
  <!-- headline -->
  <text x="80" y="300" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="#F4F7FB">Make every machine</text>
  <text x="80" y="375" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="url(#accent)">request prove itself.</text>
  <!-- subhead -->
  <text x="80" y="440" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#B7C2D6">Proof-bound authorization for AI agents, machine clients,</text>
  <text x="80" y="475" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#B7C2D6">and service APIs. Verified locally. No long-lived secrets.</text>
  <!-- proof strip -->
  <g transform="translate(80,540)">
    <rect x="0" y="0" width="240" height="50" rx="6" fill="#11182B" stroke="#2B3854"/>
    <text x="120" y="32" font-family="IBM Plex Mono, monospace" font-size="18" fill="#6EE7FF" text-anchor="middle">Identify</text>
    <rect x="260" y="0" width="240" height="50" rx="6" fill="#11182B" stroke="#2B3854"/>
    <text x="380" y="32" font-family="IBM Plex Mono, monospace" font-size="18" fill="#6EE7FF" text-anchor="middle">Prove</text>
    <rect x="520" y="0" width="240" height="50" rx="6" fill="#11182B" stroke="#2B3854"/>
    <text x="640" y="32" font-family="IBM Plex Mono, monospace" font-size="18" fill="#6EE7FF" text-anchor="middle">Authorize</text>
    <rect x="780" y="0" width="240" height="50" rx="6" fill="#11182B" stroke="#2B3854"/>
    <text x="900" y="32" font-family="IBM Plex Mono, monospace" font-size="18" fill="#6EE7FF" text-anchor="middle">Audit</text>
  </g>
  <!-- url -->
  <text x="1120" y="595" font-family="IBM Plex Mono, monospace" font-size="20" fill="#4b5563" text-anchor="end">trustplane.dev</text>
</svg>
