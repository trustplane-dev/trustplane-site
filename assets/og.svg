<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="accent1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accent2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0e6e5c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0e6e5c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0f1a"/>
  <rect width="1200" height="630" fill="url(#accent1)"/>
  <rect width="1200" height="630" fill="url(#accent2)"/>
  <!-- grid lines -->
  <g stroke="#2B3854" stroke-width="1" opacity="0.25">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- logo mark -->
  <g transform="translate(80,80)">
    <path d="M28 8 L48 18 V38 L28 48 L8 38 V18 L28 8 Z" fill="none" stroke="#0e6e5c" stroke-width="2"/>
    <path d="M28 18 L38 23 V33 L28 38 L18 33 V23 L28 18 Z" fill="#0e6e5c" fill-opacity="0.2" stroke="#0e6e5c" stroke-width="1.5"/>
  </g>
  <text x="140" y="115" font-family="Space Grotesk, system-ui, sans-serif" font-size="28" font-weight="600" fill="#F4F6F3">TrustPlane</text>
  <!-- eyebrow -->
  <text x="80" y="230" font-family="JetBrains Mono, monospace" font-size="20" fill="#0e6e5c" letter-spacing="1.5">OPEN-SOURCE MACHINE AUTHORIZATION</text>
  <!-- headline -->
  <text x="80" y="300" font-family="Space Grotesk, system-ui, sans-serif" font-size="60" font-weight="600" fill="#F4F6F3" letter-spacing="-1.5">Make every machine</text>
  <text x="80" y="370" font-family="Space Grotesk, system-ui, sans-serif" font-size="60" font-weight="600" fill="#c2410c" letter-spacing="-1.5">request prove itself.</text>
  <!-- subhead -->
  <text x="80" y="435" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#a8b6ca">Proof-bound authorization for AI agents, machine clients,</text>
  <text x="80" y="468" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#a8b6ca">and service APIs. Verified locally. No long-lived secrets.</text>
  <!-- proof strip -->
  <g transform="translate(80,540)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#111827" stroke="#29415e"/>
    <text x="120" y="32" font-family="JetBrains Mono, monospace" font-size="18" fill="#0e6e5c" text-anchor="middle">Identify</text>
    <rect x="260" y="0" width="240" height="50" rx="4" fill="#111827" stroke="#29415e"/>
    <text x="380" y="32" font-family="JetBrains Mono, monospace" font-size="18" fill="#0e6e5c" text-anchor="middle">Prove</text>
    <rect x="520" y="0" width="240" height="50" rx="4" fill="#111827" stroke="#29415e"/>
    <text x="640" y="32" font-family="JetBrains Mono, monospace" font-size="18" fill="#0e6e5c" text-anchor="middle">Authorize</text>
    <rect x="780" y="0" width="240" height="50" rx="4" fill="#111827" stroke="#29415e"/>
    <text x="900" y="32" font-family="JetBrains Mono, monospace" font-size="18" fill="#0e6e5c" text-anchor="middle">Audit</text>
  </g>
  <!-- url -->
  <text x="1120" y="595" font-family="JetBrains Mono, monospace" font-size="18" fill="#4b5563" text-anchor="end">trustplane.dev</text>
</svg>
