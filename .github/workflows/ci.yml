name: Site CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Verify published CNAME
        run: |
          test "$(cat dist/public/CNAME)" = "trustplane.dev"

      - name: Scan for leaked local paths
        run: |
          ! grep -RInE '/Users/|/home/[a-z]+/' \
            --include='*.ts' --include='*.tsx' --include='*.html' --include='*.css' \
            client shared server
